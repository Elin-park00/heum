/* ============ 캐릭터 ============ */
function heum(size,o){
  o=o||{};
  const x=o.x||0, y=o.y||0, s=o.s||1;
  const tear=o.tear?`<path d="M138 344 Q130 358 134 367 Q139 376 148 371 Q157 366 152 355 Z" fill="#F7F5F0" stroke="#14203A" stroke-width="3"/>`:"";
  const wet=o.wet?`<circle cx="147" cy="322" r="5" fill="#F7F5F0"/><circle cx="209" cy="317" r="4.4" fill="#F7F5F0"/>`:"";
  const mouth = o.mouth==="down"
    ? `<path d="M168 368 Q192 356 218 368" fill="none" stroke="#14203A" stroke-width="4" stroke-linecap="round"/>`
    : o.mouth==="dot"
    ? `<circle cx="192" cy="362" r="6" fill="#14203A"/>`
    : `<path d="M170 362 Q192 372 216 360" fill="none" stroke="#14203A" stroke-width="4" stroke-linecap="round"/>`;
  return `<svg width="${size}" height="${size*0.86}" viewBox="90 240 210 180" aria-hidden="true">
   <path d="M118 264 Q170 244 226 261 Q274 278 276 328 Q278 378 224 397 Q164 415 126 390 Q96 368 98 321 Q100 281 118 264 Z" fill="#F2C14E" stroke="#14203A" stroke-width="4" stroke-linejoin="round"/>
   <circle cx="158" cy="318" r="30" fill="#F7F5F0" stroke="#14203A" stroke-width="4"/>
   <circle cx="218" cy="314" r="25" fill="#F7F5F0" stroke="#14203A" stroke-width="4"/>
   <circle cx="${158+x}" cy="${318+y}" r="${14*s}" fill="#14203A"/>
   <circle cx="${218+x*0.9}" cy="${314+y*0.9}" r="${12*s}" fill="#14203A"/>
   ${wet}${tear}${mouth}
  </svg>`;
}

/* ============ 상태 ============ */
const S={a:[],i:0,type:null,rid:null,sid:null,t0:0};

function uid(n){const c="abcdefghijkmnpqrstuvwxyz23456789";let s="";for(let i=0;i<(n||8);i++)s+=c[Math.floor(Math.random()*c.length)];return s;}
S.sid = localStorage.getItem("heum_sid") || (function(){const v=uid(12);localStorage.setItem("heum_sid",v);return v;})();

/* ============ 로그 ============ */
function log(name,payload){
  const e={session_id:S.sid,result_id:S.rid,name:name,payload:payload||{},created_at:new Date().toISOString()};
  const k="heum_events";
  const arr=JSON.parse(localStorage.getItem(k)||"[]");
  arr.push(e); localStorage.setItem(k,JSON.stringify(arr.slice(-500)));
  if(CONFIG.supabaseUrl){
    fetch(CONFIG.supabaseUrl+"/rest/v1/events",{method:"POST",
      headers:{"Content-Type":"application/json",apikey:CONFIG.supabaseKey,Authorization:"Bearer "+CONFIG.supabaseKey},
      body:JSON.stringify(e)}).catch(function(){});
  }
}
function save(table,row){
  const k="heum_"+table;
  const arr=JSON.parse(localStorage.getItem(k)||"[]");
  arr.push(row); localStorage.setItem(k,JSON.stringify(arr));
  if(CONFIG.supabaseUrl){
    fetch(CONFIG.supabaseUrl+"/rest/v1/"+table,{method:"POST",
      headers:{"Content-Type":"application/json",apikey:CONFIG.supabaseKey,Authorization:"Bearer "+CONFIG.supabaseKey},
      body:JSON.stringify(row)}).catch(function(){});
  }
}

const app=document.getElementById("app");
function render(html){app.innerHTML='<div class="scr on">'+html+'</div>';window.scrollTo(0,0);}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("on");setTimeout(function(){t.classList.remove("on")},1800);}

const sheet=document.getElementById("sheet");
document.getElementById("sheetclose").onclick=function(){sheet.classList.remove("on")};
sheet.onclick=function(e){if(e.target===sheet)sheet.classList.remove("on")};

function shareLink(where){
  const t=T[S.type];
  const base=location.href.split("#")[0].split("?")[0].replace(/[^/]*$/,"");
  const url=base+"t/"+S.type+".html";
  const txt="나 "+t.name+" 나왔음. 너는 뭐 나옴?";
  const full=txt+"\n"+url;
  log("share_click",{ch:where});

  if(navigator.share){
    navigator.share({text:txt,url:url}).then(function(){
      log("share_done",{ch:"native"});
    }).catch(function(){
      copyOrShow(full);
    });
    return;
  }
  copyOrShow(full);
}

function copyOrShow(full){
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(full).then(function(){
      toast("링크 복사됨");
      log("share_done",{ch:"clipboard"});
    }).catch(function(){ showSheet(full); });
  } else {
    showSheet(full);
  }
}

function showSheet(full){
  const box=document.getElementById("linktext");
  box.value=full;
  sheet.classList.add("on");
  log("share_done",{ch:"sheet"});
}

document.getElementById("docopy").onclick=function(){
  const box=document.getElementById("linktext");
  box.focus();
  box.select();
  box.setSelectionRange(0,box.value.length);
  let ok=false;
  try{ ok=document.execCommand("copy"); }catch(e){ ok=false; }
  if(!ok && navigator.clipboard){
    navigator.clipboard.writeText(box.value).then(function(){
      toast("복사됨");
    }).catch(function(){
      toast("전체 선택됨 · 직접 복사해주세요");
    });
    return;
  }
  toast(ok?"복사됨":"전체 선택됨 · 직접 복사해주세요");
};

/* ============ ① 랜딩 ============ */
function landing(){
  app.className="";
  render(`
    <div class="scr on dark" style="display:flex">
      <div class="grow" style="display:flex;flex-direction:column;justify-content:center;align-items:center">
        ${heum(150,{y:7})}
        <div class="sp"></div>
        <h1 class="center">나 왜 자꾸<br>새벽에 결제함?</h1>
        <p class="sub center">3분 · 12문항 · 가입 없이</p>
      </div>
      <button class="btn" id="go">시작하기</button>
      <p class="sub center" style="margin-top:14px;font-size:13px">로그인 없이 결과까지 볼 수 있어요</p>
    </div>`);
  document.body.style.background="#0E1729";
  document.getElementById("app").style.background="var(--navy)";
  document.getElementById("go").onclick=function(){log("test_start");S.i=0;S.a=[];question();};
  log("landing_view",{ref:document.referrer||null});
}

/* ============ ② 문항 ============ */
function question(){
  const n=S.i, q=Q[n];
  S.t0=Date.now();
  document.getElementById("app").style.background="var(--paper)";
  document.body.style.background="#0E1729";
  render(`
    <div class="count">${n+1} / 12</div>
    <div class="bar"><i style="width:${(n)/12*100}%"></i></div>
    <h2>${q[0].replace(/\n/g,"<br>")}</h2>
    <div class="sp"></div>
    <div id="opts">
      ${q[1].map(function(o,i){return '<button class="opt" data-i="'+i+'">'+o+'</button>'}).join("")}
    </div>
    <div class="grow"></div>
    ${n>0?'<button class="back" id="bk">← 이전</button>':''}
  `);
  setTimeout(function(){const b=document.querySelector(".bar i");if(b)b.style.width=((n+1)/12*100)+"%";},30);
  log("question_view",{q:n+1});
  document.getElementById("opts").onclick=function(e){
    const b=e.target.closest(".opt"); if(!b)return;
    b.classList.add("sel");
    const i=+b.dataset.i;
    S.a[n]=i;
    log("question_answer",{q:n+1,choice:i,ms:Date.now()-S.t0});
    setTimeout(function(){
      if(S.i<11){S.i++;question();} else {finish();}
    },170);
  };
  if(n>0)document.getElementById("bk").onclick=function(){log("question_back",{q:n+1});S.i--;question();};
}

/* ============ 채점 ============ */
function finish(){
  const sum={decision:0,motive:0,regret:0};
  S.a.forEach(function(c,i){sum[AXES[i]]+=SCORE[c];});
  const d=sum.decision>0, m=sum.motive>0, r=sum.regret>0;
  let code;
  if(d&&m&&r)code="dawn";
  else if(d&&!m&&r)code="just";
  else if(!d&&m&&r)code="three";
  else if(!d&&!m&&r)code="review";
  else if(d&&m&&!r)code="then";
  else if(d&&!m&&!r)code="anyway";
  else if(!d&&m&&!r)code="wish";
  else code="soldout";
  S.type=code; S.rid=uid(8);
  save("responses",{result_id:S.rid,answers:S.a,score_decision:sum.decision,score_motive:sum.motive,score_regret:sum.regret,type_code:code,created_at:new Date().toISOString()});
  log("test_complete",{type:code});
  result();
}

/* ============ ③ 결과 ============ */
function result(){
  const t=T[S.type];
  const fg=t.dark?"#F7F5F0":"#14203A";
  const cardBg=t.dark?"rgba(255,255,255,.07)":"rgba(20,32,58,.05)";
  document.getElementById("app").style.background=t.bg;
  document.body.style.background=t.dark?"#0E1729":"#E8E5DE";
  render(`
    <div class="scr on" style="display:flex;color:${fg};background:${t.bg}">
      <p class="center" style="font-size:13px;opacity:.65;margin-bottom:10px">당신의 소비 유형은</p>
      <div style="display:flex;justify-content:center">${heum(140,t.eye)}</div>
      <div class="sp"></div>
      <div class="center">
        <div class="tname">${t.name}</div>
        <p class="tline">${t.line}</p>
      </div>
      <div class="card" style="background:${cardBg}">
        <h3>이럴 때 약함</h3>
        <ul>${t.weak.map(function(w){return "<li>"+w+"</li>"}).join("")}</ul>
      </div>
      <div class="card" style="background:${cardBg}">
        <h3>근데 이건 잘함</h3>
        <p>${t.good}</p>
      </div>
      <div class="card rule" style="border:2px solid #F2C14E;background:${t.dark?"rgba(242,193,78,.10)":"#FFF9EC"}">
        <h3 style="color:${t.dark?"#F2C14E":"#A8792A"}">후회 줄이는 법, 딱 하나만</h3>
        <p class="rtitle">${t.rule}</p>
        <p style="opacity:.8">${t.why.split("\n").join("<br>")}</p>
      </div>
      <p class="pct">8유형 중 하나 · 비율은 응답이 더 모이면 공개</p>
      <div class="grow" style="min-height:26px"></div>
      <button class="btn" id="next">친구는 뭐 나옴?</button>
    </div>`);
  log("result_view",{type:S.type});
  let deep=0;
  app.onscroll=null;
  window.onscroll=function(){
    const p=Math.round((window.scrollY+window.innerHeight)/document.body.scrollHeight*100);
    if(p>deep+24){deep=p;log("result_scroll",{depth:p});}
  };
  document.getElementById("next").onclick=match;
}

/* ============ ④ 궁합 ============ */
function match(){
  const t=T[S.type], w=T[WORST[S.type]], b=T[BRAKE[S.type]];
  document.getElementById("app").style.background="var(--paper)";
  document.body.style.background="#E8E5DE";
  window.onscroll=null;
  render(`
    <h2 class="center" style="margin-bottom:2px">소비 궁합</h2>
    <p class="sub center">같이 쇼핑하면 어떻게 될까</p>
    <div class="mrow">${heum(104,t.eye)}${heum(104,w.eye)}</div>
    <div class="card" style="background:#FDF6E7;border:1.5px solid #ECD9A8">
      <div class="mtag" style="color:#A8792A">최악의 쇼핑메이트</div>
      <div class="mname">${w.name}</div>
      <p style="color:#7A6A50">둘이 가면 둘 다 삽니다. 서로를 말리지 못해요.</p>
    </div>
    <div class="card" style="background:#fff;border:1.5px solid var(--line)">
      <div class="mtag" style="color:#5F7568">최고의 브레이크</div>
      <div class="mname">${b.name}</div>
      <p style="color:#7A8496">당신을 유일하게 멈춰 세울 수 있는 유형</p>
    </div>
    <div class="grow" style="min-height:24px"></div>
    <button class="btn" id="share">친구한테 보내기</button>
    <div style="height:9px"></div>
    <button class="btn ghost" id="ask" style="color:var(--navy)">고민 중인 거 있는데</button>
  `);
  log("match_view");
  document.getElementById("share").onclick=function(){shareLink("match")};
  document.getElementById("ask").onclick=ask;
}

/* ============ ⑤ 고민 등록 ============ */
function ask(){
  const t=T[S.type];
  render(`
    <h2>${t.name}님,<br>지금 고민 중인 거 있어요?</h2>
    <p class="sub" style="margin-bottom:26px">3일 뒤에 어떻게 됐는지 물어볼게요</p>
    <div class="field">
      <label class="flabel" for="item">나 지금 뭐 살까 말까</label>
      <input class="inp" id="item" placeholder="코트" autocomplete="off" maxlength="40">
      <p class="err" id="e1">뭘 고민 중인지 적어주세요</p>
    </div>
    <div class="field">
      <label class="flabel" for="amt">얼마짜리?</label>
      <input class="inp" id="amt" placeholder="200,000" inputmode="numeric" autocomplete="off">
      <p class="err" id="e2">금액을 숫자로 적어주세요</p>
    </div>
    <div class="grow" style="min-height:20px"></div>
    <button class="btn" id="reg">등록하기</button>
    <button class="btn plain" id="skip">나중에</button>
  `);
  log("ask_view");
  const amt=document.getElementById("amt");
  amt.oninput=function(){
    const v=amt.value.replace(/[^0-9]/g,"");
    amt.value=v?Number(v).toLocaleString():"";
    document.getElementById("e2").classList.remove("on");
  };
  document.getElementById("item").oninput=function(){document.getElementById("e1").classList.remove("on")};
  document.getElementById("reg").onclick=function(){
    const item=document.getElementById("item").value.trim();
    const n=+amt.value.replace(/[^0-9]/g,"");
    let bad=false;
    if(!item){document.getElementById("e1").classList.add("on");bad=true;}
    if(!n){document.getElementById("e2").classList.add("on");bad=true;}
    if(bad)return;
    save("concerns",{result_id:S.rid,item:item,amount:n,created_at:new Date().toISOString()});
    log("ask_submit",{amount:n});
    done(item);
  };
  document.getElementById("skip").onclick=function(){log("ask_skip");done(null);};
}

/* ============ 완료 ============ */
function done(item){
  const t=T[S.type];
  document.getElementById("app").style.background="var(--navy)";
  document.body.style.background="#0E1729";
  render(`
    <div class="scr on dark" style="display:flex;background:var(--navy)">
      <div class="grow" style="display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center">
        ${heum(130,{y:-7,mouth:"dot"})}
        <div class="sp"></div>
        ${item
          ? `<h2>${item}, 기억해둘게요</h2><p class="sub">3일 뒤에 어떻게 됐는지 물어볼게요.<br>알림 기능은 곧 붙습니다.</p>`
          : `<h2>또 봐요</h2><p class="sub">고민되는 게 생기면 그때 오세요.</p>`}
      </div>
      <button class="btn" id="again">친구한테 보내기</button>
      <button class="btn plain" id="re" style="color:#6F829F">다시 하기</button>
    </div>`);
  document.getElementById("again").onclick=function(){shareLink("end")};
  document.getElementById("re").onclick=function(){S.a=[];S.i=0;landing();};
}

landing();
</script>
</body>
</html>
